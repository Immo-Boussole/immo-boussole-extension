name: Build & Release Extension

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Firefox Extension
        run: npm run build:firefox

      - name: Build Chrome & Edge Extension
        run: npm run build:chrome

      - name: Package ZIP distributions
        run: |
          mkdir -p release
          cd dist-firefox && zip -r ../release/immo-boussole-firefox.zip . && cd ..
          cd dist-chrome && zip -r ../release/immo-boussole-chrome-edge.zip . && cd ..

      - name: Determine Version Tag
        id: vars
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "RELEASE_NAME=Release ${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=v1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT
            echo "RELEASE_NAME=Release v1.0.${{ github.run_number }} (Build ${{ github.run_number }})" >> $GITHUB_OUTPUT
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extension-dist-packages
          path: release/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.TAG_NAME }}
          name: ${{ steps.vars.outputs.RELEASE_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/immo-boussole-firefox.zip
            release/immo-boussole-chrome-edge.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
