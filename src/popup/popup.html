<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Immo-Boussole Extension</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="header">
    <div class="logo-title">
      <img src="../../icons/icon32.png" class="logo-img" alt="Logo" width="22" height="22" />
      <h1 data-i18n="popupTitle">Immo-Boussole</h1>
      <span id="ext-version" class="version-tag"></span>
    </div>
    <span id="connection-badge" class="badge badge-disconnected" data-i18n="statusDisconnected">Disconnected</span>
  </div>

  <!-- Cloudflare Alert Banner (hidden by default) -->
  <div id="cloudflare-banner" class="cloudflare-alert" style="display: none;">
    <div class="cf-icon">🛡️</div>
    <div class="cf-text" data-i18n="cloudflareDetected">Cloudflare protection detected. A new tab was opened. Solve the verification and click Retry.</div>
    <button type="button" id="btn-retry-cf" class="btn btn-warning btn-sm" data-i18n="btnRetry">🔄 Retry Connection</button>
  </div>

  <!-- Already Saved Banner -->
  <div id="already-saved-card" class="card card-already-saved" style="display: none;">
    <div class="saved-icon">✅</div>
    <div class="saved-info">
      <div class="saved-title" data-i18n="activeTabAlreadyImported">Cette annonce est déjà enregistrée dans Immo-Boussole.</div>
      <button type="button" id="btn-open-existing-tab" class="btn btn-action btn-sm" data-i18n="btnOpenInImmoBoussole">👁️ Ouvrir dans Immo-Boussole ↗</button>
    </div>
  </div>

  <div class="card config-card" id="config-card">
    <div class="card-header-toggle" id="config-toggle-header">
      <h2 data-i18n="configHeader">Server Configuration</h2>
      <span id="config-toggle-icon" class="toggle-icon">▼</span>
    </div>
    
    <div id="config-body" class="config-body">
      <div class="form-group">
        <label for="server-url" data-i18n="serverUrlLabel">Immo-Boussole Instance URL</label>
        <input type="url" id="server-url" placeholder="https://my-immo-boussole.org" required />
      </div>

      <!-- Auth Tabs Switcher -->
      <div class="tabs-nav">
        <button type="button" id="tab-btn-apikey" class="tab-btn active" data-i18n="tabApiKey">API Key</button>
        <button type="button" id="tab-btn-userpass" class="tab-btn" data-i18n="tabUserPass">Username & Password</button>
      </div>

      <!-- Pane 1: API Key -->
      <div id="tab-pane-apikey" class="tab-pane active">
        <form id="apikey-form">
          <div class="form-group">
            <label for="api-key" data-i18n="apiKeyLabel">API Key (Bearer Token)</label>
            <input type="password" id="api-key" data-i18n-placeholder="apiKeyPlaceholder" placeholder="Enter your API key..." />
          </div>
          <div class="button-group">
            <button type="submit" id="btn-save" class="btn btn-primary" data-i18n="btnSave">Save</button>
            <button type="button" id="btn-test" class="btn btn-secondary" data-i18n="btnTestConnection">Test Connection</button>
          </div>
        </form>
      </div>

      <!-- Pane 2: Username & Password -->
      <div id="tab-pane-userpass" class="tab-pane" style="display: none;">
        <form id="userpass-form">
          <div class="form-group">
            <label for="username" data-i18n="usernameLabel">Username</label>
            <input type="text" id="username" data-i18n-placeholder="usernamePlaceholder" placeholder="Enter username..." autocomplete="username" />
          </div>
          <div class="form-group">
            <label for="password" data-i18n="passwordLabel">Password</label>
            <input type="password" id="password" data-i18n-placeholder="passwordPlaceholder" placeholder="Enter password..." autocomplete="current-password" />
          </div>
          <div class="button-group">
            <button type="submit" id="btn-login" class="btn btn-primary" data-i18n="btnLogin">Log In & Connect</button>
          </div>
        </form>
      </div>

      <div id="status-message" class="status-msg"></div>
    </div>
  </div>

  <div class="card">
    <h2 data-i18n="addListingHeader">Add Listing</h2>
    <p class="subtitle" data-i18n="addListingSubtitle">Add the current active tab or enter a listing URL:</p>
    <button type="button" id="btn-add-current" class="btn btn-action" data-i18n="btnAddCurrentTab">
      ➕ Add Current Tab
    </button>
    
    <div class="manual-input">
      <input type="url" id="manual-url" data-i18n-placeholder="manualUrlPlaceholder" placeholder="https://www.leboncoin.fr/ad/..." />
      <button type="button" id="btn-add-manual" class="btn btn-secondary" data-i18n="btnAddManual">Add</button>
    </div>

    <div class="checkbox-container">
      <label class="checkbox-label">
        <input type="checkbox" id="open-tab-checkbox" checked />
        <span data-i18n="openTabAfterImport">Ouvrir un nouvel onglet après l'import</span>
      </label>
    </div>

    <div id="add-status-message" class="status-msg"></div>
    <button type="button" id="btn-view-listing" class="btn btn-secondary btn-sm btn-view-immo" style="display: none;" data-i18n="btnViewListing">
      👁️ Voir dans Immo-Boussole
    </button>
  </div>

  <script type="module" src="popup.ts"></script>
</body>
</html>
