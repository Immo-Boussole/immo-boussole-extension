<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=440, height=280">
  <title>Immo-Boussole Petite Image Promotionnelle</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }
    body {
      width: 440px;
      height: 280px;
      overflow: hidden;
      background: radial-gradient(circle at top right, #1e3a8a, #0f172a 70%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      position: relative;
    }
    .glow-circle {
      position: absolute;
      width: 260px;
      height: 260px;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.25) 0%, rgba(15, 23, 42, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .logo-box {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 2px solid #3b82f6;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4);
      margin-bottom: 14px;
      position: relative;
      z-index: 2;
    }
    .logo-box img {
      width: 42px;
      height: 42px;
    }
    .title {
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      position: relative;
      z-index: 2;
    }
    .subtitle {
      font-size: 13px;
      color: #94a3b8;
      font-weight: 500;
      margin-bottom: 16px;
      position: relative;
      z-index: 2;
    }
    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(37, 99, 235, 0.25);
      border: 1px solid rgba(96, 165, 250, 0.4);
      color: #60a5fa;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      position: relative;
      z-index: 2;
    }
  </style>
</head>
<body>
  <div class="glow-circle"></div>
  <div class="logo-box">
    <img src="../../icons/icon48.png" alt="Logo" />
  </div>
  <h1 class="title">Immo-Boussole</h1>
  <p class="subtitle">Importation & Synchronisation Immobilière en 1 Clic</p>
  <div class="badge-pill">
    <span>🧭</span>
    <span>Extension Officielle</span>
  </div>
</body>
</html>
